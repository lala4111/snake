<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info">Score: 0 </p>


    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        function movement(){
            //Read the current head
            const head = { ...snake[0] };
            let info = document.getElementById("info");
            //Create a new position object
            head.x += direction.x;
            head.y += direction.y;
            //Add that new position to the front of snake
            snake.unshift(head);
            //Remove the last segment
            let  match = false;
            if((head.x=== food.x)&&(head.y === food.y)){
            match = true;}

            if(match === false){
                snake.pop();
            }
            else{
                score++; 
                info.textContent = "Score:" +score;
                changeFoodPosition();}
            //Call drawGame()

            drawGame();
            

            

        
        }
        //This gives the movement of the rectangle
        setInterval(movement, 200);
        

        

        // Step 2: Keyboard controls (arrow keys)
        //create an event listener when key is pressed
        //this creates how to move the rectangle
        document.addEventListener('keydown', function (e) {
            const click = e.key;
            let newDirection = { x: 0, y: 0 };

            switch (click) {
                case "ArrowLeft":
                    newDirection = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    newDirection = { x: 1, y: 0 };
                    break;
                case "ArrowUp":
                    newDirection = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    newDirection = { x: 0, y: 1 };
                    break;
                    //handle when the other keys are pressed 
                default: return;
            }

            if(!(direction.x === -newDirection.x) || !(direction.y === -newDirection.y)){
                direction.x = newDirection.x;
                direction.y = newDirection.y;
            }

        });
        // Step 3: Eating and growing
        /*let  match = false;

        if((head.x=== food.x)&&(head.y === food.y)){
            match = true;
        }

        if(match === false){
            snake.pop();
        }*/

        function changeFoodPosition(){
            food.x = Math.floor(Math.random()*tileCount);
            food.y = Math.floor(Math.random()*tileCount);

            food = {x: food.x, y: food.y}

            
            return food;
        }
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

    

</body>
</html>
